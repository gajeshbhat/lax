[package]
name = "lax"
version = "0.1.0"
edition = "2024"
description = "Smart shell autocomplete based on command success history"
license = "MIT"
repository = "https://github.com/yourusername/lax"
keywords = ["shell", "autocomplete", "cli", "history", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "lax"
path = "src/main.rs"

[lib]
name = "lax"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
